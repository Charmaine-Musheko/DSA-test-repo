<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Rental Service
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'rentalApp:dashboard' %}"
        >
            Rental Platform
        </a>


        <div class="navbar-nav">

            <a
                class="nav-link"
                href="{% url 'rentalApp:property_list' %}"
            >
                Properties
            </a>

            <a
                class="nav-link"
                href="{% url 'rentalApp:property_create' %}"
            >
                Add Property
            </a>

            <a
                class="nav-link"
                href="{% url 'rentalApp:property_search' %}"
            >
                Search
            </a>

            <a
                class="nav-link"
                href="{% url 'rentalApp:property_book' %}"
            >
                Book
            </a>

            <a
                class="nav-link"
                href="{% url 'rentalApp:booking_confirm' %}"
            >
                Confirm
            </a>

        </div>

    </div>

</nav>


<div class="container py-4">

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert
                {% if message.tags == 'error' %}
                    alert-danger
                {% else %}
                    alert-{{ message.tags }}
                {% endif %}"
            >

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    {% block content %}
    {% endblock %}

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
