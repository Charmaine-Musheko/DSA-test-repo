<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Rental Service
        {% endblock %}
    </title>


    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- MDBootstrap -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/8.2.0/mdb.min.css"
        rel="stylesheet"
    >


    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
        }

        /* Floating Island Navbar */
        .island-navbar {
            margin: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .island-navbar .navbar-brand {
            font-weight: 600;
        }

        .island-navbar .nav-link {
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .island-navbar .nav-link:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

    </style>

</head>


<body class="bg-light">


<!-- =========================
     NAVIGATION
========================= -->

<nav
    class="navbar navbar-expand-lg navbar-dark bg-dark island-navbar"
>

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'rentalApp:dashboard' %}"
        >
            <i class="fas fa-house me-2"></i>
            Rental Platform
        </a>


        <div class="navbar-nav">

            <a
                class="nav-link"
                href="{% url 'rentalApp:dashboard' %}"
            >
                <i class="fas fa-gauge-high me-1"></i>
                Dashboard
            </a>


            <a
                class="nav-link"
                href="{% url 'rentalApp:user_list' %}"
            >
                <i class="fas fa-users me-1"></i>
                Users
            </a>


            <a
                class="nav-link"
                href="{% url 'rentalApp:property_list' %}"
            >
                <i class="fas fa-building me-1"></i>
                Properties
            </a>


            <a
                class="nav-link"
                href="{% url 'rentalApp:booking_list' %}"
            >
                <i class="fas fa-calendar-check me-1"></i>
                Bookings
            </a>


            <a
                class="nav-link"
                href="{% url 'rentalApp:removed_booking_list' %}"
            >
                <i class="fas fa-clock-rotate-left me-1"></i>
                Booking History
            </a>

        </div>

    </div>

</nav>


<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container py-4">


    <!-- Django Messages -->

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert
                {% if message.tags == 'error' %}
                    alert-danger
                {% else %}
                    alert-{{ message.tags }}
                {% endif %}"
                role="alert"
            >

                <i class="fas fa-circle-info me-2"></i>

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    <!-- Page Content -->

    {% block content %}
    {% endblock %}


</div>


<!-- =========================
     MDBOOTSTRAP JAVASCRIPT
========================= -->

<script
    type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/8.2.0/mdb.umd.min.js"
></script>


</body>

</html>
