{% extends "../base.html" %}

{% block title %}
Add Property
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="mb-4">
                    Add Property
                </h3>


                <form method="post">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Host ID
                        </label>

                        <input
                            type="text"
                            name="host_id"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Property Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Region
                            </label>

                            <input
                                type="text"
                                name="region"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Property Type
                            </label>

                            <input
                                type="text"
                                name="property_type"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Price Per Night
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="price_per_night"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            rows="4"
                            class="form-control"
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Register Property
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
