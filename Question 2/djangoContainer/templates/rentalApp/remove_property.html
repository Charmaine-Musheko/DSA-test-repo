<!-- update_property.html -->
{% extends "../base.html" %}
{% block title %}Update Property{% endblock %}
{% block content %}

<h2>Update Property</h2>

<form method="post" class="card card-body mt-4">
{% csrf_token %}

<input name="property_id" class="form-control mb-3"
       placeholder="Property ID" required>

<input name="price_per_night" type="number" step="0.01"
       class="form-control mb-3" placeholder="New price">

<select name="status" class="form-select mb-3">
    <option value="">Do not change status</option>
    <option value="AVAILABLE">Available</option>
    <option value="BOOKED">Booked</option>
    <option value="UNDER_MAINTENANCE">Under Maintenance</option>
    <option value="DELISTED">Delisted</option>
</select>

<textarea name="description" class="form-control mb-3"
          placeholder="New description"></textarea>

<button class="btn btn-primary">
    Update Property
</button>

</form>

{% endblock %}
